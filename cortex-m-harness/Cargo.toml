[package]
name = "cortex-m-harness"
description = "Bare-metal measurement harness for drifters on Cortex-M, run under QEMU"
version = "0.1.0"
edition = "2021"
publish = false
# Two binaries live here — the measurement harness and the panic audit — so
# `cargo run` needs to be told which is the ordinary one.
default-run = "cortex-m-harness"

# Excluded from the main workspace: it targets bare metal, needs its own linker
# configuration, and `cargo test --workspace` must not try to build it.
[workspace]

[dependencies]
drifters-core = { path = "../crates/drifters-core" }
drifters-filter = { path = "../crates/drifters-filter" }
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = "0.6"

[features]
default = []
## Build the filter in its 15-state configuration.
reduced-state = ["drifters-filter/reduced-state"]
## Carry the covariance factors in `f32`. The Cortex-M4F FPU is
## single-precision only, so this is the difference between hardware
## arithmetic and calls into the soft-float `__aeabi_d*` routines.
f32-covariance = ["drifters-filter/f32-covariance"]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = true
overflow-checks = false
