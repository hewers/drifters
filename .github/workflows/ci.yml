name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the previous run obsolete; cancel it rather
# than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # NOT `--all-features` across the workspace: that would enable
      # `gnss-rtk-interop`, pulling AGPL code and a large dependency tree into
      # every ordinary CI run. The `interop` job covers the permissive adapter
      # deliberately and on its own. See docs/adr/0003.
      - run: cargo test --workspace --exclude drifters-interop --all-features
      - run: cargo test --workspace --no-default-features
      # `reduced-state` and `f32-covariance` are both non-additive: one removes
      # states, the other changes the numerics of every filter in the build.
      # `--all-features` above enables them together, which is a real
      # configuration but not the one most users get, so each also runs alone.
      - run: cargo test -p drifters-filter -p drifters-proto --features reduced-state
      - run: cargo test -p drifters-filter --features f32-covariance
      # The whole campaign at single precision, against the same expectations.
      - run: cargo test -p drifters-cli --features f32-covariance

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # See the note in the `test` job on why this is not `--all-features`.
      - run: cargo clippy --workspace --exclude drifters-interop --all-targets --all-features

  # The job that actually proves no_std. A crate can silently acquire a `std`
  # dependency and nothing in a host build will notice; this fails when it does.
  no_std:
    name: bare-metal build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          # Cortex-M4F / M7 — hardware single-precision float, f64 in software.
          - thumbv7em-none-eabihf
          # Cortex-M0+ — no FPU at all, the hardest portability case.
          - thumbv6m-none-eabi
          # RISC-V, to prove nothing is quietly Arm specific.
          - riscv32imac-unknown-none-elf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p drifters-core --target ${{ matrix.target }}
      - run: cargo build -p drifters-filter --target ${{ matrix.target }}
      - run: cargo build -p drifters-proto --target ${{ matrix.target }}
      - run: cargo build -p drifters-eqf --target ${{ matrix.target }}
      # The smoothing recorder is a feature because of its size, not because it
      # allocates. It has to build for a target too.
      - run: cargo build -p drifters-filter --target ${{ matrix.target }} --features smoothing
      # The reason `f32-covariance` exists: on `thumbv7em` the FPU is
      # single-precision, so this is the difference between `vmla.f32` and a
      # call into `__aeabi_dmul`. It has to build everywhere, including on the
      # targets with no FPU at all, where it is merely smaller.
      - run: cargo build -p drifters-filter --target ${{ matrix.target }} --features f32-covariance
      # No `drifters-gnss` here on purpose: it is the desktop half and uses
      # `std` deliberately. See its crate docs.

      # The runtime crates touch no heap. `alloc` is a sysroot crate, so using
      # `Vec` or `Box` from a `no_std` crate requires naming it — which makes
      # its absence a checkable invariant rather than an aspiration. The
      # fixed-capacity `heapless` types `drifters-proto` uses live on the
      # stack and need no allocator.
      - name: no crate in the runtime stack requires an allocator
        run: |
          set -euo pipefail
          found=0
          for c in core filter eqf proto; do
            if grep -rn "extern crate alloc" "crates/drifters-$c/src"; then
              echo "::error::drifters-$c requires an allocator"
              found=1
            fi
          done
          test "$found" -eq 0

  # Catches an accidental breaking change to a published API. It compares
  # against the last release tag rather than against crates.io, so it works on
  # a branch before anything is published and keeps working if a release is
  # ever yanked.
  #
  # Before the first tag there is no baseline and nothing to compare, which the
  # job says out loud rather than passing silently — a green check that checked
  # nothing is worse than no check.
  semver:
    name: semantic versioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, and enough history to build the baseline from one.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: compare the public API against the last release tag
        run: |
          set -euo pipefail
          baseline=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$baseline" ]; then
            echo "::notice::No release tag exists yet, so there is no baseline."
            echo "This job begins checking at the first tag. See docs/releasing.md."
            exit 0
          fi
          echo "Comparing against $baseline"
          # Named rather than `--workspace`: `drifters-cli` and `xtask` are
          # `publish = false` and have no public API to keep, and naming the
          # list means a new crate is a deliberate addition here.
          cargo semver-checks --baseline-rev "$baseline" \
            -p drifters-core \
            -p drifters-filter \
            -p drifters-gnss \
            -p drifters-eqf \
            -p drifters-proto \
            -p drifters-interop

  # The MSRV that matters is the embedded one. `drifters-core`, `-filter` and
  # `-eqf` depend on nothing but `libm`, so they can hold a floor far below what
  # the rest of the workspace needs, and a firmware project on an older pinned
  # toolchain can still use them. `drifters-proto` pulls `micropb` (1.88) and
  # `heapless` (1.87), and everything downstream of it inherits that — which is
  # why building the whole workspace here would only ever measure `micropb`.
  msrv:
    name: minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p drifters-core -p drifters-filter -p drifters-eqf
      # Including under the features that change the filter, since a feature
      # can reach for something newer without the default build noticing.
      - run: >
          cargo build -p drifters-filter
          --features f32-covariance,reduced-state,smoothing,std
      # The crates above the floor, at the floor they declare.
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo build --workspace

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --exclude drifters-interop --no-deps --all-features

  # The checked-in protobuf bindings must match the schemas that produced them.
  # `cargo xtask proto` needs no `protoc` — the whole toolchain is pure Rust,
  # so this job installs nothing beyond the Rust toolchain itself.
  proto:
    name: generated bindings are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask proto --check

  # The fuzz target needs nightly, so it cannot run in the main test job. A
  # short run on every push catches a target that stopped compiling; depth comes
  # from running it out of band.
  fuzz:
    name: fuzz decode (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run decode -- -max_total_time=60
        working-directory: fuzz

  # The interop adapters are off by default, so the main test job never
  # compiles them. This one does — but only the MIT adapter. `gnss-rtk` is
  # AGPL-3.0 and is deliberately NOT built in CI: keeping it out of the
  # standard pipeline is part of making it an informed, explicit choice.
  # Build it locally with:
  #   cargo build -p drifters-interop --features gnss-rtk-interop
  interop:
    name: interop adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p drifters-interop --features nav-types-interop

  # Boots the filter on an emulated Cortex-M4 and checks its stack high-water
  # mark against a documented ceiling. Stack painting measures memory writes,
  # which QEMU emulates exactly, so this number is trustworthy — unlike any
  # timing measurement from an emulator, which is why none is taken.
  cortex_m:
    name: bare-metal stack budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      # Building is its own step so that "the harness does not compile" and
      # "the harness overflowed its budget" are different red marks in the job
      # list. They were the same one for three weeks; see docs/testing.md.
      - name: build the harness in every configuration
        working-directory: cortex-m-harness
        run: |
          cargo build --release
          cargo build --release --features reduced-state
          cargo build --release --features f32-covariance
          cargo build --release --bin panic_audit
      - name: run harness under QEMU
        working-directory: cortex-m-harness
        run: |
          set -o pipefail
          cargo run --release | tee report.txt
          peak=$(grep -oP 'PEAK\s+\K[0-9]+' report.txt)
          echo "peak stack: $peak bytes"
          # Ceiling, not a target. 20 KiB leaves headroom over the measured
          # 18.5 KiB while still failing if a change reintroduces the
          # expression-chained form that cost 35.3 KiB.
          #
          # This job could not build for three weeks — `cargo run` went
          # ambiguous when a second binary was added — and in that window the
          # peak grew 63 % unnoticed. A job that fails to build is a job that
          # measures nothing, so the build is now a separate step above.
          test "$peak" -lt 20480 || { echo "stack budget exceeded"; exit 1; }
      - name: the 15-state configuration must fit a 16 KiB stack
        working-directory: cortex-m-harness
        run: |
          set -o pipefail
          cargo run --release --features reduced-state | tee reduced.txt
          peak=$(grep -oP 'PEAK\s+\K[0-9]+' reduced.txt)
          echo "reduced peak stack: $peak bytes"
          # The whole point of this configuration is fitting where 21 states do
          # not. Measured at 10 464 B.
          test "$peak" -lt 12288 || { echo "reduced-state budget exceeded"; exit 1; }
      - name: the single-precision covariance must also fit
        working-directory: cortex-m-harness
        run: |
          set -o pipefail
          cargo run --release --features f32-covariance | tee f32.txt
          peak=$(grep -oP 'PEAK\s+\K[0-9]+' f32.txt)
          echo "f32-covariance peak stack: $peak bytes"
          # Halving the covariance cannot make the stack grow, and on the
          # predict path it shrinks it by 22 %. Measured at 17 976 B.
          test "$peak" -lt 20480 || { echo "f32-covariance budget exceeded"; exit 1; }
      - name: the data path must link no panic machinery
        working-directory: cortex-m-harness
        run: |
          cargo build --release --bin panic_audit
          bin=target/thumbv7em-none-eabihf/release/panic_audit
          if nm "$bin" | grep -i 'core9panicking'; then
            echo "the filter's data path can reach a panic; see docs/testing.md Layer 9"
            exit 1
          fi
          echo "no panic machinery linked"

  # Licence and advisory auditing.
  #
  # Deliberately run on the DEFAULT feature set. `gnss-rtk` is AGPL-3.0 and is
  # not on the allow list, so `--all-features` fails by design — that is the
  # machine check behind ADR 0003, which says a permissive crate must never
  # carry an AGPL dependency on its default path. Enabling the feature is the
  # user's informed choice; making it the project's default is not.
  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
      - name: the AGPL boundary must actually hold
        run: |
          if cargo deny --all-features check licenses 2>&1 | grep -q 'AGPL-3.0'; then
            echo "confirmed: enabling gnss-rtk-interop is caught by the licence policy"
          else
            echo "the AGPL guard did not fire; the boundary in ADR 0003 is unenforced"
            exit 1
          fi
