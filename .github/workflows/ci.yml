name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --no-default-features

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features

  # The job that actually proves no_std. A crate can silently acquire a `std`
  # dependency and nothing in a host build will notice; this fails when it does.
  no_std:
    name: bare-metal build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          # Cortex-M4F / M7 — hardware single-precision float, f64 in software.
          - thumbv7em-none-eabihf
          # Cortex-M0+ — no FPU at all, the hardest portability case.
          - thumbv6m-none-eabi
          # RISC-V, to prove nothing is quietly Arm specific.
          - riscv32imac-unknown-none-elf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p drifters-core --target ${{ matrix.target }}
      - run: cargo build -p drifters-filter --target ${{ matrix.target }}
      - run: cargo build -p drifters-proto --target ${{ matrix.target }}

  msrv:
    name: minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  deny:
    name: licences + advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The checked-in protobuf bindings must match the schemas that produced them.
  # `cargo xtask proto` needs no `protoc` — the whole toolchain is pure Rust,
  # so this job installs nothing beyond the Rust toolchain itself.
  proto:
    name: generated bindings are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask proto --check

  # The fuzz target needs nightly, so it cannot run in the main test job. A
  # short run on every push catches a target that stopped compiling; depth comes
  # from running it out of band.
  fuzz:
    name: fuzz decode (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run decode -- -max_total_time=60
        working-directory: fuzz

  # The interop adapters are off by default, so the main test job never
  # compiles them. This one does — but only the MIT adapter. `gnss-rtk` is
  # AGPL-3.0 and is deliberately NOT built in CI: keeping it out of the
  # standard pipeline is part of making it an informed, explicit choice.
  # Build it locally with:
  #   cargo build -p drifters-interop --features gnss-rtk-interop
  interop:
    name: interop adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p drifters-interop --features nav-types-interop

  # Boots the filter on an emulated Cortex-M4 and checks its stack high-water
  # mark against a documented ceiling. Stack painting measures memory writes,
  # which QEMU emulates exactly, so this number is trustworthy — unlike any
  # timing measurement from an emulator, which is why none is taken.
  cortex_m:
    name: bare-metal stack budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: run harness under QEMU
        working-directory: cortex-m-harness
        run: |
          set -o pipefail
          cargo run --release | tee report.txt
          peak=$(grep -oP 'PEAK\s+\K[0-9]+' report.txt)
          echo "peak stack: $peak bytes"
          # Ceiling, not a target. 20 KiB leaves headroom over the measured
          # 16.5 KiB while still failing if a change reintroduces the
          # expression-chained form that cost 35.3 KiB.
          test "$peak" -lt 20480 || { echo "stack budget exceeded"; exit 1; }
