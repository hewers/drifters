name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the previous run obsolete; cancel it rather
# than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # NOT `--all-features` across the workspace: that would enable
      # `gnss-rtk-interop`, pulling AGPL code and a large dependency tree into
      # every ordinary CI run. The `interop` job covers the permissive adapter
      # deliberately and on its own. See docs/adr/0003.
      - if: runner.os != 'Windows'
        run: cargo test --workspace --exclude drifters-interop --all-features
      # `defmt` needs a global logger and linker-script symbols that only
      # firmware supplies. The Linux and macOS linkers discard the code that
      # refers to them, but MSVC's stops with LNK2019, so a host binary built
      # with `defmt` cannot link here. Every other feature still runs, and the
      # list comes from the manifests so that a new feature is not missed.
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          features=$(cargo metadata --no-deps --format-version 1 | jq -j '
            [.packages[] | select(.name != "drifters-interop") | .name as $p
             | .features | keys[] | select(. != "defmt") | "\($p)/\(.)"]
            | join(",")')
          cargo test --workspace --exclude drifters-interop --features "$features"
      - run: cargo test --workspace --no-default-features
      # `reduced-state` and `f32-covariance` are both non-additive: one removes
      # states, the other changes the numerics of every filter in the build.
      # `--all-features` above enables them together, which is a real
      # configuration but not the one most users get, so each also runs alone.
      - run: cargo test -p drifters-filter -p drifters-proto --features reduced-state
      - run: cargo test -p drifters-filter --features f32-covariance
      # The whole campaign at single precision, against the same expectations.
      - run: cargo test -p drifters-cli --features f32-covariance
      # The engine properties at 15 states.
      - run: cargo test -p drifters-cli --features reduced-state --test engine_robustness

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # See the note in the `test` job on why this is not `--all-features`.
      - run: cargo clippy --workspace --exclude drifters-interop --all-targets --all-features

  # The job that actually proves no_std. A crate can silently acquire a `std`
  # dependency and nothing in a host build will notice; this fails when it does.
  no_std:
    name: bare-metal build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          # Cortex-M4F, and any M7 built without `target-cpu=cortex-m7`:
          # hardware single-precision float, f64 in software.
          - thumbv7em-none-eabihf
          # Cortex-M0+ — no FPU at all, the hardest portability case.
          - thumbv6m-none-eabi
          # RISC-V, to prove nothing is quietly Arm specific.
          - riscv32imac-unknown-none-elf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p drifters-core --target ${{ matrix.target }}
      - run: cargo build -p drifters-filter --target ${{ matrix.target }}
      - run: cargo build -p drifters-proto --target ${{ matrix.target }}
      - run: cargo build -p drifters-eqf --target ${{ matrix.target }}
      # The smoothing recorder is a feature because of its size, not because it
      # allocates. It has to build for a target too.
      - run: cargo build -p drifters-filter --target ${{ matrix.target }} --features smoothing
      # The reason `f32-covariance` exists: on `thumbv7em` the FPU is
      # single-precision, so this is the difference between `vmla.f32` and a
      # call into `__aeabi_dmul`. It has to build everywhere, including on the
      # targets with no FPU at all, where it is merely smaller.
      - run: cargo build -p drifters-filter --target ${{ matrix.target }} --features f32-covariance
      # The optional features, which exist for exactly these targets. `defmt`
      # is how firmware logs; `serde` is for host-side configuration, but it
      # is declared without `std`, and this is the build that would notice if
      # that stopped being true.
      - run: >
          cargo build -p drifters-filter -p drifters-eqf -p drifters-proto
          --target ${{ matrix.target }}
          --features drifters-filter/defmt,drifters-eqf/defmt,drifters-proto/defmt
      - run: >
          cargo build -p drifters-filter -p drifters-eqf
          --target ${{ matrix.target }}
          --features drifters-filter/serde,drifters-eqf/serde
      # No `drifters-gnss` here on purpose: it is the desktop half and uses
      # `std` deliberately. See its crate docs.

      # The runtime crates touch no heap. `alloc` is a sysroot crate, so using
      # `Vec` or `Box` from a `no_std` crate requires naming it — which makes
      # its absence a checkable invariant rather than an aspiration. The
      # fixed-capacity `heapless` types `drifters-proto` uses live on the
      # stack and need no allocator.
      - name: no crate in the runtime stack requires an allocator
        run: |
          set -euo pipefail
          found=0
          for c in core filter eqf proto; do
            if grep -rn "extern crate alloc" "crates/drifters-$c/src"; then
              echo "::error::drifters-$c requires an allocator"
              found=1
            fi
          done
          test "$found" -eq 0

  # Catches an accidental breaking change to a published API. It compares
  # against the last release tag rather than against crates.io, so it works on
  # a branch before anything is published and keeps working if a release is
  # ever yanked.
  #
  # Before the first tag there is no baseline and nothing to compare, which the
  # job says out loud rather than passing silently — a green check that checked
  # nothing is worse than no check.
  semver:
    name: semantic versioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, and enough history to build the baseline from one.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: compare the public API against the last release tag
        run: |
          set -euo pipefail
          baseline=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$baseline" ]; then
            echo "::notice::No release tag exists yet, so there is no baseline."
            echo "This job begins checking at the first tag. See docs/releasing.md."
            exit 0
          fi
          echo "Comparing against $baseline"
          # Named rather than `--workspace`: `drifters-cli` and `xtask` are
          # `publish = false` and have no public API to keep, and naming the
          # list means a new crate is a deliberate addition here.
          cargo semver-checks --baseline-rev "$baseline" \
            -p drifters-core \
            -p drifters-filter \
            -p drifters-gnss \
            -p drifters-eqf \
            -p drifters-proto \
            -p drifters-interop

  # The MSRV that matters is the embedded one. `drifters-core`, `-filter` and
  # `-eqf` depend on nothing but `libm`, so they can hold a floor far below what
  # the rest of the workspace needs, and a firmware project on an older pinned
  # toolchain can still use them. `drifters-proto` pulls `micropb` (1.88) and
  # `heapless` (1.87), and everything downstream of it inherits that — which is
  # why building the whole workspace here would only ever measure `micropb`.
  msrv:
    name: minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p drifters-core -p drifters-filter -p drifters-eqf
      # The host-side libraries hold the same floor. Neither needs anything
      # newer, and they sat at 1.88 for a while with no reason anyone could
      # name, so the floor is checked here rather than asserted.
      - run: cargo build -p drifters-gnss
      - run: cargo build -p drifters-interop --features nav-types-interop
      # Including under the features that change the filter, since a feature
      # can reach for something newer without the default build noticing.
      - run: >
          cargo build -p drifters-filter
          --features f32-covariance,reduced-state,smoothing,std,defmt,serde
      - run: cargo build -p drifters-eqf --features std,defmt,serde
      # The crates above the floor, at the floor they declare.
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo build --workspace

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --exclude drifters-interop --no-deps --all-features

  # The checked-in protobuf bindings must match the schemas that produced them.
  # `cargo xtask proto` needs no `protoc` — the whole toolchain is pure Rust,
  # so this job installs nothing beyond the Rust toolchain itself.
  proto:
    name: generated bindings are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask proto --check

  # The fuzz targets need nightly, so they cannot run in the main test job. A
  # short run on every push catches a target that stopped compiling and anything
  # shallow; depth comes from running them out of band. The engine target runs
  # once per filter configuration, because `f32-covariance` and `reduced-state`
  # change what the filter computes.
  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run decode -- -max_total_time=60
        working-directory: fuzz
      - run: cargo fuzz run engine -- -max_total_time=60 -max_len=4096 -timeout=30
        working-directory: fuzz
      - run: cargo fuzz run --features f32-covariance engine -- -max_total_time=60 -max_len=4096 -timeout=30
        working-directory: fuzz
      - run: cargo fuzz run --features reduced-state engine -- -max_total_time=60 -max_len=4096 -timeout=30
        working-directory: fuzz

  # The interop adapters are off by default, so the main test job never
  # compiles them. This one does — but only the MIT adapter. `gnss-rtk` is
  # AGPL-3.0 and is deliberately NOT built in CI: keeping it out of the
  # standard pipeline is part of making it an informed, explicit choice.
  # Build it locally with:
  #   cargo build -p drifters-interop --features gnss-rtk-interop
  interop:
    name: interop adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p drifters-interop --features nav-types-interop

  # Boots every filter configuration on an emulated Cortex-M4 and Cortex-M7,
  # checks each stack high-water mark against a documented ceiling, and compares
  # what the builds computed. Stack painting measures memory writes, which QEMU
  # emulates exactly, so those numbers are trustworthy — unlike any timing
  # measurement from an emulator, which is why none is taken.
  cortex_m:
    name: bare-metal stack budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      # Building is its own step so that "the harness does not compile" and
      # "the harness overflowed its budget" are different red marks in the job
      # list. They were the same one for three weeks; see docs/testing.md.
      - name: build the harness in every configuration
        working-directory: cortex-m-harness
        run: |
          cargo build --release
          cargo build --release --features reduced-state
          cargo build --release --features f32-covariance
          cargo build --release --features reduced-state,f32-covariance
          cargo build --release --bin panic_audit
      # All four filter configurations on both cores: `f64` in software on the
      # Cortex-M4, and on the double-precision FPU on the Cortex-M7. The stack
      # ceilings and what each is for are in the script.
      - name: every configuration on a Cortex-M4, with f64 in software
        working-directory: cortex-m-harness
        run: ./check-core.sh m4 target/agreement
      - name: every configuration on a Cortex-M7, with f64 in hardware
        working-directory: cortex-m-harness
        run: ./check-core.sh m7 target/agreement
      # The two cores must give the same answers to the bit, and `f32` must stay
      # within a small fraction of the filter's own sigma of `f64`.
      - name: both cores and both precisions must agree
        run: cargo xtask agreement cortex-m-harness/target/agreement
      - name: the data path must link no panic machinery
        working-directory: cortex-m-harness
        run: |
          # Every configuration: `f32-covariance` and `reduced-state` change
          # what the filter computes, so none inherits the default's audit.
          for features in "" "--features f32-covariance" "--features reduced-state" "--features reduced-state,f32-covariance"; do
            cargo build --release --bin panic_audit $features
            bin=target/thumbv7em-none-eabihf/release/panic_audit
            if nm "$bin" | grep -i 'core9panicking'; then
              echo "the data path can reach a panic in [$features]; see docs/testing.md Layer 10"
              exit 1
            fi
            echo "no panic machinery linked [${features:-default}]"
          done

      # `RUSTFLAGS` is written out in full because this replaces the workflow's
      # value, it does not add to it.
      - name: on a Cortex-M7, the data path must link no panic machinery
        working-directory: cortex-m-harness
        env:
          RUSTFLAGS: -D warnings -C target-cpu=cortex-m7
          CARGO_TARGET_DIR: target-m7
        run: |
          for features in "" "--features f32-covariance" "--features reduced-state" "--features reduced-state,f32-covariance"; do
            cargo build --release --bin panic_audit $features
            if nm target-m7/thumbv7em-none-eabihf/release/panic_audit | grep -i 'core9panicking'; then
              echo "the data path can reach a panic in [$features]; see docs/testing.md Layer 10"
              exit 1
            fi
            echo "no panic machinery linked [${features:-default}]"
          done

  # The firmware `hil.yml` flashes onto a board. A runner with a board attached
  # is not something every push can have, so this keeps the firmware building
  # for that board, and runs its emulated form, with a register-level model of
  # the sensor, on QEMU's Cortex-M7. It measures nothing: QEMU's cycle counter
  # does not count.
  hil_firmware:
    name: hardware-in-the-loop firmware (QEMU)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -C target-cpu=cortex-m7
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cortex-m-hil
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: build for the board
        working-directory: cortex-m-hil
        run: |
          cargo build --release
          cargo build --release --features physical-imu
      - name: run under QEMU, with the simulated sensor
        working-directory: cortex-m-hil
        env:
          CARGO_TARGET_THUMBV7EM_NONE_EABIHF_RUNNER: >-
            timeout 600 qemu-system-arm -machine mps2-an500 -cpu cortex-m7 -nographic
            -semihosting-config enable=on,target=native -kernel
        run: cargo run --release --no-default-features --features qemu,physical-imu

  # The worked RTIC example: an IMU interrupt feeding the engine, late GNSS
  # fixes applied by rewinding, telemetry out. It runs on QEMU's STM32F405
  # board under `-icount`, so its timing is deterministic, and the firmware
  # judges itself. It exits non-zero if the solution ends more than 10 cm from
  # the truth, an IMU sample was dropped, or a fix was not applied. An example
  # nothing runs is an example that has stopped working.
  rtic_example:
    name: RTIC example (QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/rtic-imu
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: build
        working-directory: examples/rtic-imu
        run: cargo build --release
      - name: run under QEMU
        working-directory: examples/rtic-imu
        run: timeout 600 cargo run --release

  # `portable_simd` is opt-in through `--cfg drifters_nightly_simd`, not a cargo
  # feature, so that `--all-features` on stable does not try to enable a
  # nightly-only attribute. Nothing here gates a release; it runs so the path
  # cannot rot silently between now and stabilisation, because an unbuilt
  # configuration is not a configuration and this repository has learnt that
  # the expensive way.
  nightly_simd:
    name: portable_simd (nightly, optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: build and test with portable_simd
        env:
          RUSTFLAGS: --cfg drifters_nightly_simd
        run: |
          cargo test -p drifters-filter
          cargo test -p drifters-filter --features f32-covariance
          cargo build -p drifters-filter --target thumbv7em-none-eabihf --features f32-covariance

  # Licence and advisory auditing.
  #
  # Deliberately run on the DEFAULT feature set. `gnss-rtk` is AGPL-3.0 and is
  # not on the allow list, so `--all-features` fails by design — that is the
  # machine check behind ADR 0003, which says a permissive crate must never
  # carry an AGPL dependency on its default path. Enabling the feature is the
  # user's informed choice; making it the project's default is not.
  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
      - name: the AGPL boundary must actually hold
        run: |
          if cargo deny --all-features check licenses 2>&1 | grep -q 'AGPL-3.0'; then
            echo "confirmed: enabling gnss-rtk-interop is caught by the licence policy"
          else
            echo "the AGPL guard did not fire; the boundary in ADR 0003 is unenforced"
            exit 1
          fi
