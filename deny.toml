# cargo-deny configuration.
#
# The licence policy here is load-bearing, not boilerplate: see
# docs/adr/0003-interop-boundary.md. `gnss-rtk` is AGPL-3.0, and this project is
# permissively licensed, so a copyleft dependency reaching the default path is a
# CI failure rather than something to discover at release time.

[graph]
all-features = false

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

# AGPL and GPL must never appear in the default dependency graph. Enabling the
# `gnss-rtk` feature of drifters-interop deliberately breaks this check — that
# is the point: it makes the licensing consequence visible rather than silent.
[[bans.deny]]
name = "gnss-rtk"
wrappers = ["drifters-interop"]

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
