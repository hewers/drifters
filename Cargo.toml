[workspace]
resolver = "2"
members = [
    "crates/drifters-core",
    "crates/drifters-filter",
    "crates/drifters-eqf",
    "crates/drifters-gnss",
    "crates/drifters-proto",
    "crates/drifters-interop",
    "crates/drifters-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The floor for the library crates. `drifters-core`, `-filter` and `-eqf` have
# no dependencies beyond `libm`; `drifters-gnss` and `drifters-interop` add only
# `std` and the optional adapters. `drifters-proto` overrides it, because
# `micropb` and `heapless` need newer releases, and so does `drifters-cli`.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hewers/drifters"
authors = ["drifters contributors"]

[workspace.dependencies]
drifters-core = { version = "0.1.0", path = "crates/drifters-core", default-features = false }
drifters-eqf = { version = "0.1.0", path = "crates/drifters-eqf", default-features = false }
drifters-gnss = { version = "0.1.0", path = "crates/drifters-gnss" }
drifters-filter = { version = "0.1.0", path = "crates/drifters-filter", default-features = false }

# The only required non-dev dependency in the no_std core stack.
libm = "0.2"

# Optional, each behind a feature of the same name and off by default: `Format`
# for logging on target, and `Serialize`/`Deserialize` for host-side
# configuration. `serde` is used without its `std` feature, so enabling it keeps
# the crates `no_std`; a host program that turns `serde/std` on is a `std`
# build, with the one-ulp caveat adr/0004 describes.
defmt = "1"
serde = { version = "1", default-features = false, features = ["derive"] }

# dev / host-only
approx = "0.5"
proptest = "1"
# `float_roundtrip`: the default parser can be an ulp out, and the round-trip
# tests compare exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# Tests are the one dev build whose runtime is dominated by arithmetic, and the
# Monte Carlo NEES campaigns are the extreme case: a debug build of
# `a_filter_told_the_gravity_gradient_stays_consistent` alone runs for hours on
# CI hardware, because every `propagate` and every Jacobian is executed
# unoptimised. Optimising the `test` profile makes that campaign take about a
# minute and a half including the build. `debug-assertions` and `overflow-checks`
# stay on — this is not a release build, and the checks are part of what the
# tests exercise. `dev` is deliberately left alone so that `cargo build` and
# `cargo run` keep their fast compile times.
[profile.test]
opt-level = 2

# Embedded profile: optimise for size, keep overflow checks on so a filter
# divergence traps instead of silently wrapping.
[profile.embedded]
inherits = "release"
opt-level = "s"
overflow-checks = true
debug-assertions = false
