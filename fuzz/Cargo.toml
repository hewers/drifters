[package]
name = "drifters-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Excluded from the workspace: cargo-fuzz builds with its own flags and a
# nightly toolchain, and `cargo test --workspace` must not try to build it.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
drifters-core = { path = "../crates/drifters-core" }
drifters-eqf = { path = "../crates/drifters-eqf" }
drifters-filter = { path = "../crates/drifters-filter" }
drifters-proto = { path = "../crates/drifters-proto" }
micropb = { version = "0.6", default-features = false, features = [
    "encode",
    "decode",
    "enable-64bit",
    "container-heapless-0-9",
] }

# The two configurations that change the ESKF's arithmetic, so that the `engine`
# target can search them as well: `--features f32-covariance`.
[features]
reduced-state = ["drifters-filter/reduced-state"]
f32-covariance = ["drifters-filter/f32-covariance"]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine"
path = "fuzz_targets/engine.rs"
test = false
doc = false
bench = false
