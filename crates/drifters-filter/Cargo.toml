[package]
name = "drifters-filter"
description = "no_std error-state Kalman filter for aided inertial navigation (GNSS/INS): estimates extended pose and IMU errors from IMU, GNSS and auxiliary sensors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
authors.workspace = true
categories = ["no-std", "science", "embedded"]
keywords = ["navigation", "gnss", "ins", "kalman", "sensor-fusion"]

[dependencies]
drifters-core = { workspace = true }

[dev-dependencies]
approx = { workspace = true }

[features]
default = []
## Drop the six IMU scale-factor states, giving a 15-state filter.
##
## Every matrix halves — the covariance goes from 3 528 to 1 800 bytes — which
## is the cheapest large saving available on a small target, because it changes
## no numerics at all. Appropriate when the IMU's scale factors are calibrated
## and stable, or when the dynamics never make them observable: a vehicle
## driving in a straight line at constant speed observes neither.
##
## NOT additive: this *removes* states, so it changes `N_STATE` and the
## filter's behaviour. Do not enable it via feature unification by accident.
reduced-state = []
## Enables `std`-only conveniences inherited from `drifters-core`.
std = ["drifters-core/std"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
