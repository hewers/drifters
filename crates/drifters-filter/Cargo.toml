[package]
name = "drifters-filter"
description = "no_std error-state Kalman filter fusing IMU, GNSS and auxiliary sensors for pose estimation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories = ["no-std", "science", "embedded"]
keywords = ["navigation", "gnss", "ins", "kalman", "sensor-fusion"]

[dependencies]
drifters-core = { workspace = true }

[dev-dependencies]
approx = { workspace = true }

[features]
default = []
## Enables `std`-only conveniences inherited from `drifters-core`.
std = ["drifters-core/std"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
