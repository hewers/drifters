[package]
name = "drifters-filter"
description = "no_std error-state Kalman filter for aided inertial navigation (GNSS/INS): estimates extended pose and IMU errors from IMU, GNSS and auxiliary sensors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
authors.workspace = true
categories = ["no-std", "science", "embedded"]
keywords = ["navigation", "gnss", "ins", "kalman", "sensor-fusion"]

[dependencies]
drifters-core = { workspace = true }

[dev-dependencies]
approx = { workspace = true }

[features]
default = []
## Drop the six IMU scale-factor states, giving a 15-state filter.
##
## Every matrix halves — the covariance goes from 3 528 to 1 800 bytes — which
## is the cheapest large saving available on a small target, because it changes
## no numerics at all. Appropriate when the IMU's scale factors are calibrated
## and stable, or when the dynamics never make them observable: a vehicle
## driving in a straight line at constant speed observes neither.
##
## NOT additive: this *removes* states, so it changes `N_STATE` and the
## filter's behaviour. Do not enable it via feature unification by accident.
reduced-state = []
## Carry the covariance factors in `f32` instead of `f64`.
##
## Only the factors: the states, the Jacobians and the gains stay `f64`, and so
## does position — see [`ud::Scalar`] for why that last one is not negotiable.
## Halves the covariance (1 848 to 924 bytes) and puts its arithmetic in single
## precision, which on a Cortex-M4F is hardware where `f64` is emulated.
##
## Safe to enable because the covariance is stored factored. `P`'s diagonal
## spans more decimal digits than `f32` carries; `U` and `D` span the square
## root of that. Measured over the full campaign the results are unchanged.
##
## NOT additive: this changes the numerics of every filter in the build. Do not
## enable it via feature unification by accident.
f32-covariance = []
## Enables `std`-only conveniences inherited from `drifters-core`.
std = ["drifters-core/std"]
## Record what a backward pass needs from the forward one, in
## [`engine::GinsEngine`].
##
## Nothing here allocates — this crate has no heap at all, and [`smoother`] is
## always available, writing into a caller-provided slice. What the feature
## costs is **space**: the recorder is three 21x21 matrices, four times the
## rest of the engine, taking it from 4 920 bytes to 23 168. A filter that will
## never smooth should not carry them.
smoothing = []

[lints.rust]
# `portable_simd` is opt-in through a cfg rather than a cargo feature, so that
# `--all-features` on stable does not try to enable a nightly-only attribute.
# Build it with: RUSTFLAGS="--cfg drifters_nightly_simd" cargo +nightly ...
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(drifters_nightly_simd)'] }
missing_docs = "warn"
unsafe_code = "forbid"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
