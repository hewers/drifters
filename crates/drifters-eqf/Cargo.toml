[package]
name = "drifters-eqf"
description = "Equivariant filter (EqF) for aided inertial navigation, after Fornasier et al. ICRA 2024: self-calibrating, with a fixed linearisation origin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
authors.workspace = true
categories = ["no-std", "science", "embedded"]
keywords = ["navigation", "equivariant", "lie-group", "filter", "ins"]

[dependencies]
drifters-core = { workspace = true }
defmt = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
std = ["drifters-core/std"]
## `defmt::Format` on every public type that implements `Debug`, here and in
## `drifters-core`. Formatting only.
defmt = ["dep:defmt", "drifters-core/defmt"]
## `serde` `Serialize` and `Deserialize` on [`EqfOptions`] and [`ProcessNoise`],
## and on the `drifters-core` types they contain, for configuration loaded on a
## host. Missing fields take their defaults; unknown ones are an error.
serde = ["dep:serde", "drifters-core/serde"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
