[package]
name = "drifters-eqf"
description = "Equivariant filter (EqF) for inertial navigation, after Fornasier et al. ICRA 2024"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories = ["no-std", "science", "embedded"]
keywords = ["navigation", "equivariant", "lie-group", "filter", "ins"]

[dependencies]
drifters-core = { workspace = true }

[dev-dependencies]
approx = { workspace = true }

[features]
default = []
std = ["drifters-core/std"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
