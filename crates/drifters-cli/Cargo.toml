[package]
name = "drifters-cli"
description = "Replay tool for the drifters GNSS/INS filter, compatible with the KF-GINS dataset formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "drifters_cli"
path = "src/lib.rs"

[[bin]]
name = "drifters"
path = "src/main.rs"

[dependencies]
drifters-core = { workspace = true, features = ["std"] }
drifters-filter = { workspace = true, features = ["std"] }

[dev-dependencies]
approx = { workspace = true }
