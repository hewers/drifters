[package]
name = "drifters-cli"
description = "Replay and evaluation harness for the drifters navigation filters, compatible with the KF-GINS dataset formats"
version.workspace = true
edition.workspace = true
# Above the workspace floor: depends on `drifters-proto`.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "drifters_cli"
path = "src/lib.rs"

[[bin]]
name = "drifters"
path = "src/main.rs"

[dependencies]
drifters-core = { workspace = true, features = ["std"] }
drifters-filter = { workspace = true, features = ["std", "smoothing"] }
drifters-eqf = { workspace = true, features = ["std"] }
drifters-gnss = { workspace = true }

[dev-dependencies]
approx = { workspace = true }

[features]
default = []
## Pass through to `drifters-filter`: 15 states, no scale factors.
reduced-state = ["drifters-filter/reduced-state"]
## Pass through to `drifters-filter`: single-precision covariance factors.
f32-covariance = ["drifters-filter/f32-covariance"]
