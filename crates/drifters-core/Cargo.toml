[package]
name = "drifters-core"
description = "no_std core types for aided inertial navigation (GNSS/INS): fixed-size linear algebra, quaternions, WGS-84 earth model and frame transforms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
authors.workspace = true
categories = ["no-std", "science", "embedded"]
keywords = ["navigation", "gnss", "ins", "kalman", "imu"]

[dependencies]
libm = { workspace = true }
defmt = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
## Adds `std`-only conveniences (`std::error::Error` impls, `Display` helpers).
## Does **not** change any arithmetic: scalar math always goes through `libm`
## so results are bit-identical on host and target. See docs/adr/0004.
std = []
## `defmt::Format` on every public type that implements `Debug`, for logging
## on target. Formatting only: no arithmetic changes.
defmt = ["dep:defmt"]
## `serde` `Serialize` and `Deserialize` on the value types configuration is
## made of, for loading it on a host. `no_std`: serde's own `std` is not
## enabled here, though a host program's format crate usually enables it, and
## then the transcendentals may be the platform's; see docs/adr/0004.
serde = ["dep:serde"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
