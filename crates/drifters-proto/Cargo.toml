[package]
name = "drifters-proto"
description = "no_std protobuf serialization for drifters aided-inertial-navigation types"
version.workspace = true
edition.workspace = true
# Above the workspace floor: `micropb` requires 1.88 and `heapless` 1.87.
rust-version = "1.88"
license.workspace = true
readme = "README.md"
repository.workspace = true
authors.workspace = true
categories = ["no-std::no-alloc", "encoding", "embedded"]
keywords = ["navigation", "protobuf", "gnss", "ins", "no-std"]

[dependencies]
drifters-core = { workspace = true }
# Each engine is optional and off by default, and the two are treated alike: its
# feature adds the conversions that need its types, and nothing else does. The
# messages for both, and decoding them, need neither engine.
drifters-eskf = { workspace = true, optional = true }
drifters-eqf = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
# Allocation-free protobuf runtime. `container-heapless` supplies the
# fixed-capacity vectors the generated repeated fields use.
micropb = { version = "0.6", default-features = false, features = [
    "encode",
    "decode",
    "enable-64bit",
    "container-heapless-0-9",
] }
# 0.9.4 clears the RUSTSEC-2026-0574..-0582 unsoundness advisories in 0.9.3.
heapless = "0.9.4"

[dev-dependencies]
approx = { workspace = true }
proptest = { workspace = true }
# Doctests link dev-dependencies, not the crate's own dependencies, so these
# are repeated here to keep the usage example compiling.
micropb = { version = "0.6", default-features = false, features = [
    "encode",
    "decode",
    "enable-64bit",
    "container-heapless-0-9",
] }
heapless = "0.9.4"

[features]
default = []
## The ESKF's conversions: `GinsOptions`, and encoding `eskf_solution` with its
## sigmas, `eskf_covariance`, and `eskf_state_matrix`. The only thing that needs
## `drifters-eskf`. The generated `GinsOptions`, `EskfSolution`, and
## `EskfCovariance` messages and the decode side (`NavState` from a solution,
## `eskf_state_std`, `eskf_covariance_values`) need no engine and are always
## available.
eskf = ["dep:drifters-eskf"]
## The EqF's conversions: `EqfOptions`, `ProcessNoise`, and `eqf_solution`. The
## only thing that needs `drifters-eqf`. The generated `EqfOptions` and
## `EqfSolution` messages and the decode side (`EqfEstimate`, `eqf_state_std`)
## need no engine and are always available.
eqf = ["dep:drifters-eqf"]
## Pass through to `drifters-eskf`: 15 states, no scale factors. Implies `eskf`.
reduced-state = ["eskf", "drifters-eskf/reduced-state"]
std = ["drifters-core/std", "drifters-eskf?/std", "drifters-eqf?/std"]
## `defmt::Format` on [`ConvertError`], and through to `drifters-core`, and to
## each engine whose feature is on. The generated message types do not
## implement it.
defmt = [
    "dep:defmt",
    "drifters-core/defmt",
    "drifters-eskf?/defmt",
    "drifters-eqf?/defmt",
]

[lints.rust]
unsafe_code = "forbid"

[package.metadata.docs.rs]
# Not `all-features`: `reduced-state` is not additive, and with it on docs.rs
# would document the 15-state build. `eskf` and `eqf` are additive and belong
# here, so both engines' conversions are documented.
features = ["std", "defmt", "eskf", "eqf"]
rustdoc-args = ["--cfg", "docsrs"]
