[package]
name = "drifters-proto"
description = "no_std protobuf serialization for drifters aided-inertial-navigation types"
version.workspace = true
edition.workspace = true
# Above the workspace floor: `micropb` requires 1.88 and `heapless` 1.87.
rust-version = "1.88"
license.workspace = true
readme = "README.md"
repository.workspace = true
authors.workspace = true
categories = ["no-std", "encoding", "embedded"]
keywords = ["navigation", "protobuf", "gnss", "ins", "no-std"]

[dependencies]
drifters-core = { workspace = true }
# Optional: the EqF's conversions are the only thing here that needs it, and a
# firmware running the ESKF alone should not link the EqF engine.
drifters-eqf = { workspace = true, optional = true }
drifters-filter = { workspace = true }
defmt = { workspace = true, optional = true }
# Allocation-free protobuf runtime. `container-heapless` supplies the
# fixed-capacity vectors the generated repeated fields use.
micropb = { version = "0.6", default-features = false, features = [
    "encode",
    "decode",
    "enable-64bit",
    "container-heapless-0-9",
] }
# 0.9.4 clears the RUSTSEC-2026-0574..-0582 unsoundness advisories in 0.9.3.
heapless = "0.9.4"

[dev-dependencies]
approx = { workspace = true }
proptest = { workspace = true }
# Doctests link dev-dependencies, not the crate's own dependencies, so these
# are repeated here to keep the usage example compiling.
micropb = { version = "0.6", default-features = false, features = [
    "encode",
    "decode",
    "enable-64bit",
    "container-heapless-0-9",
] }
heapless = "0.9.4"

[features]
default = []
## Pass through to `drifters-filter`: 15 states, no scale factors.
reduced-state = ["drifters-filter/reduced-state"]
## The EqF's `EqfOptions` and `ProcessNoise` conversions, and `eqf_solution`.
## It is the only thing that needs `drifters-eqf`, so it is off by default: a
## firmware serializing the ESKF's messages should not compile the EqF engine.
## The generated `EqfOptions` / `EqfSolution` messages and the decode side
## (`EqfEstimate`, `eqf_state_std`) need no engine and are always available.
eqf = ["dep:drifters-eqf"]
std = ["drifters-core/std", "drifters-filter/std", "drifters-eqf?/std"]
## `defmt::Format` on [`ConvertError`], and through to `drifters-core` and
## `drifters-filter` — and to `drifters-eqf` when `eqf` is on. The generated
## message types do not implement it.
defmt = [
    "dep:defmt",
    "drifters-core/defmt",
    "drifters-filter/defmt",
    "drifters-eqf?/defmt",
]

[lints.rust]
unsafe_code = "forbid"

[package.metadata.docs.rs]
# Not `all-features`: `reduced-state` is not additive, and with it on docs.rs
# would document the 15-state build. `eqf` is additive and belongs here, so the
# EqF's conversions are documented.
features = ["std", "defmt", "eqf"]
rustdoc-args = ["--cfg", "docsrs"]
