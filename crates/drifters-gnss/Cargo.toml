[package]
name = "drifters-gnss"
description = "GNSS observable processing for aided inertial navigation: robust pseudorange positioning, time-differenced carrier phase, RINEX ingest, reference-station corrections and batch trajectory fitting"
version.workspace = true
edition.workspace = true
# Above the workspace floor: depends on the toolchain the workspace tools need.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
categories = ["science", "algorithms"]
keywords = ["gnss", "gps", "rinex", "carrier-phase", "navigation"]

[dependencies]
drifters-core = { workspace = true, features = ["std"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
